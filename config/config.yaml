# Shared configuration — copied verbatim from 04_Data_Contract.md §2.
# Both back end and front end read this file. Do not hard-code these values elsewhere.
schema_version: "1.2"
lead_time_hours: {min: 3, max: 12}          # inclusive, whole hours only
report_lead_times: [3, 6, 9, 12]            # headline metrics
delay_thresholds_min: [15, 30, 45, 60]      # P(delay > k)
severe_threshold_min: 45                     # brief requirement, highlighted
delay_bands_min: [15, 30, 45, 60]           # bands: <=15, 15-30, 30-45, 45-60, >60 (+cancelled)
data_range_utc: {start: "2023-01-01T00:00:00Z", end: "2025-07-31T23:00:00Z"}
splits:                                       # by TARGET hour, UTC
  train: {start: "2023-01-01", end: "2024-12-31"}
  validation: {start: "2025-01-01", end: "2025-03-31"}
  test: {start: "2025-04-01", end: "2025-07-31"}
airports:
  ATL: {icao: "KATL", tz: "America/New_York", runway_heading_deg: 80}
  DFW: {icao: "KDFW", tz: "America/Chicago",  runway_heading_deg: 180}
risk_rules:            # Tuned on VALIDATION (L-011, B3.2): colour from P(>45) only; capacity_index_max null = disabled
  red:   {p_gt45_min: 0.172, capacity_index_max: null, basis: "validation 90th percentile"}   # was 0.30 / 0.60
  amber: {p_gt45_min: 0.117, capacity_index_max: null, basis: "validation 70th percentile"}  # was 0.15 / 0.80
# v1.2 (L-027): distribution of hour-level P(>45) on VALIDATION (same rows as the risk_rules
# percentiles). Used only to EXPLAIN the colour (marker scale, "typical hour", percentile).
# run_all.py checks these against the validation predictions.
risk_scale:
  basis: "Jan–Mar 2025 validation hours, all lead times"
  scale_max: 0.30            # right end of the on-screen scale (marker clamps beyond it)
  quantiles: {0: 0.055, 10: 0.068, 20: 0.073, 30: 0.079, 40: 0.086, 50: 0.094, 60: 0.103,
              70: 0.117, 80: 0.137, 90: 0.172, 95: 0.202, 99: 0.259, 100: 0.423}
confidence_rules:
  high:  {max_lead_h: 6,  max_obs_age_h: 1}
  low:   {min_lead_h: 10, min_obs_age_h: 3}   # either condition -> LOW
delay_estimate: {typical_prob: 0.5, bad_case_prob: 0.25}   # v1.1 likely-delay range (docs/16 §2)
nominal_arrival_rate: {ATL: null, DFW: null}  # null = show capacity as % only (no external data)

# --- Back-end-only addition (logged in reports/decisions_log.md, D-001) ---
# File locations. Not part of the contract; the front end ignores this block.
paths:
  raw_csv: "data/raw/Flight_Data_With_Weather_Final.csv"
  processed_dir: "data/processed"
  models_dir: "models"
  reports_dir: "reports"
  figures_dir: "reports/figures"
